services:
  - type: web
    name: mini-shop-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
